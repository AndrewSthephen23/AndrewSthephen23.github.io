name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancela ejecuciones obsoletas de un mismo PR. En main no se cancela
# nada para no interrumpir un despliegue a medias.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Check & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: astro check
        run: npm run check

      - name: astro build
        run: npm run build

      # En PRs el sitio compilado queda como artifact descargable para revisarlo.
      - name: Subir dist/ (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      # En main se empaqueta para GitHub Pages; lo publica el job `deploy`.
      - name: Empaquetar para GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  # CD: publica en GitHub Pages lo que compiló `build`, solo desde main y solo
  # si también pasó la verificación de placeholders.
  deploy:
    name: Deploy a GitHub Pages
    needs: [build, placeholders]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5

  placeholders:
    name: Placeholders
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # BLOQUEANTE: falla si reaparecen placeholders o CDNs en src/
      # (tu-usuario, href="#", Unsplash, Google Fonts, jsDelivr).
      - name: Buscar placeholders en src/
        run: bash .github/scripts/check-placeholders.sh src
